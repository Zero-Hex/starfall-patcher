name: Build and Release

# Spire builds, hosts and updates the patcher (Starfall > Client Patch), so a
# release here is only for patchers built before that: they read
# filelist_rof.yml and update themselves from this repository's latest
# release. This one release moves them to a patcher that reads Spire.

on:
  push:
    branches: [ "master" ]
    paths:
      - "EQEmu Patcher/**"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.1.0
  SERVER_NAME: ${{ vars.SERVER_NAME == '' && 'EQEmu Patcher' || vars.SERVER_NAME }}
  FILE_NAME: ${{ vars.FILE_NAME == '' && 'eqemupatcher' || vars.FILE_NAME }}
  # Spire's public patch address: the file list and, from now on, the patcher
  FILELIST_URL: ${{ vars.FILELIST_URL == '' && 'http://15.204.93.56:3000/api/v1/patch/' || vars.FILELIST_URL }}
  PATCHER_URL: ${{ vars.PATCHER_URL == '' && 'http://15.204.93.56:3000/api/v1/patch/' || vars.PATCHER_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: VERSION="${{ env.VERSION }}.${{ github.run_number }}" ./build.sh out

    - name: Name and hash the patcher
      run: |
        mv out/eqemupatcher.exe "${FILE_NAME}.exe" 2>/dev/null || cp out/eqemupatcher.exe "${FILE_NAME}.exe"
        # the patcher compares this with the upper-case MD5 of itself
        md5sum "${FILE_NAME}.exe" | cut -d' ' -f1 | tr a-f A-F | tr -d '\n' > "${FILE_NAME}-hash.txt"

    # Old patchers read the file list here before they update themselves, and
    # stop without one: this copy of Spire's points them at Spire.
    - name: Fetch the published file list from Spire
      run: |
        curl -fsSL -o filelist_rof.yml "${FILELIST_URL}rof/filelist_rof.yml"
        grep -q '^downloads:' filelist_rof.yml || { echo "Spire returned no file list: publish the client patch first"; exit 1; }

    - name: Release
      uses: "marvinpinto/action-automatic-releases@latest"
      if: github.ref == 'refs/heads/master'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "${{ env.VERSION }}.${{ github.run_number }}"
        prerelease: false
        title: "${{ env.VERSION }}.${{ github.run_number }}"
        files: |
          ${{ env.FILE_NAME }}.exe
          ${{ env.FILE_NAME }}-hash.txt
          filelist_rof.yml
